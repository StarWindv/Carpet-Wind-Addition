plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'Aliyun Public'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'BMCLAPI Maven'
		url = 'https://bmclapi2.bangbang93.com/maven/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	if (file('.refs/1.21.1/local-maven').isDirectory()) {
		maven {
			name = 'Local 1.21.1 dependencies'
			url = uri('.refs/1.21.1/local-maven')
		}
	}
	maven {
		name = 'Masa Maven'
		url = 'https://masa.dy.fi/maven'
	}
}

base {
	archivesName = "cwa-${project.version}-${project.minecraft_version}"
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
	archiveVersion = ""
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Only the modules used by this project are needed.
	// .refs is gitignored and only exists in the local development checkout;
	// a normal checkout resolves the standard Maven artifacts.
	if (file('.refs/1.21.1').isDirectory()) {
		modImplementation files(
			".refs/1.21.1/fabric-api-modules/fabric-api-base-0.116.17.jar",
			".refs/1.21.1/fabric-api-modules/fabric-networking-api-v1-0.116.17.jar",
			".refs/1.21.1/fabric-api-modules/fabric-resource-loader-v0-0.116.17.jar"
		)

		modImplementation files(".refs/1.21.1/fabric-carpet-1.21-1.4.147+v240613.jar")
	} else {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		modImplementation "carpet:fabric-carpet:${project.carpet_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
